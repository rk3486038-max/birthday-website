```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            background: #020006;
            color: white;
        }

        /* =========================================
           BACKGROUND PHOTO
        ========================================= */

        .blur-bg {
            position: fixed;
            inset: -30px;

            background:
                linear-gradient(
                    rgba(2, 0, 8, 0.72),
                    rgba(8, 0, 15, 0.86)
                ),
                url("./photos/Chhaya%2010.jpeg");

            background-size: cover;
            background-position: center;

            filter: blur(22px);

            transform: scale(1.08);

            z-index: -10;
        }

        .main-photo {
            position: fixed;

            width: 100%;
            height: 100%;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            object-fit: contain;
            object-position: center;

            opacity: 0.30;

            z-index: -9;
        }


        /* =========================================
           DARK OVERLAY
        ========================================= */

        .overlay {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(130, 0, 90, 0.16),
                    transparent 42%
                ),
                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.85),
                    rgba(0,0,0,0.35),
                    rgba(0,0,0,0.85)
                );

            z-index: -8;
        }


        /* =========================================
           STARS
        ========================================= */

        .stars {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: -5;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 7px rgba(255,255,255,0.9);

            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {

            from {
                opacity: 0.2;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1.4);
            }
        }


        /* =========================================
           CINEMATIC VIGNETTE
        ========================================= */

        .vignette {
            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 35%,
                    rgba(0,0,0,0.72) 100%
                );

            z-index: 10;
        }


        /* =========================================
           MAIN
        ========================================= */

        .scene {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 25px;
        }


        .content {
            max-width: 750px;

            animation: opening 2.5s ease forwards;
        }

        @keyframes opening {

            from {
                opacity: 0;
                transform:
                    scale(1.08)
                    translateY(15px);
            }

            to {
                opacity: 1;
                transform:
                    scale(1)
                    translateY(0);
            }
        }


        /* =========================================
           SMALL TEXT
        ========================================= */

        .present {

            font-size: 12px;

            letter-spacing: 6px;

            text-transform: uppercase;

            color: rgba(255,255,255,0.65);

            margin-bottom: 25px;
        }


        /* =========================================
           MAIN TITLE
        ========================================= */

        .story {

            font-size:
                clamp(45px, 10vw, 90px);

            font-weight: normal;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: white;

            text-shadow:
                0 0 25px rgba(255,255,255,0.20),
                0 0 60px rgba(255,70,170,0.22);

            margin-bottom: 20px;
        }


        .line {

            width: 80px;
            height: 1px;

            margin: 0 auto 25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff7fbd,
                    transparent
                );
        }


        /* =========================================
           STORY TEXT
        ========================================= */

        .story-text {

            font-size: 16px;

            letter-spacing: 3px;

            color: #e7cbdc;

            line-height: 1.8;

            margin-bottom: 35px;
        }


        /* =========================================
           NAMES
        ========================================= */

        .names {

            font-size:
                clamp(28px, 7vw, 55px);

            font-family:
                "Brush Script MT",
                "Segoe Script",
                cursive;

            color: #ffd8ed;

            text-shadow:
                0 0 20px rgba(255,70,170,0.45);

            margin-bottom: 12px;
        }


        .heart {

            color: #ff4f9f;

            display: inline-block;

            animation: heartbeat 1.4s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }


        .tagline {

            font-size: 13px;

            letter-spacing: 4px;

            color:
                rgba(255,255,255,0.55);

            text-transform: uppercase;

            margin-bottom: 40px;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .begin-btn {

            position: relative;

            padding: 16px 32px;

            min-width: 220px;

            border: 1px solid
                rgba(255,255,255,0.30);

            border-radius: 50px;

            background:
                rgba(255,255,255,0.07);

            color: white;

            font-size: 14px;

            letter-spacing: 2px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition:
                0.4s ease;

            overflow: hidden;
        }


        .begin-btn::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.22),
                    transparent
                );

            transition: 0.7s;
        }


        .begin-btn:hover::before {

            left: 100%;
        }


        .begin-btn:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(255,110,180,0.8);

            box-shadow:
                0 10px 35px
                rgba(255,50,160,0.25);

            background:
                rgba(255,70,160,0.12);
        }


        /* =========================================
           LOADING LINE
        ========================================= */

        .loading-line {

            position: fixed;

            bottom: 0;
            left: 0;

            height: 2px;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #ff4f9f,
                    #d48aff,
                    #ff4f9f
                );

            box-shadow:
                0 0 12px #ff4f9f;

            animation:
                loading 8s linear forwards;

            z-index: 50;
        }


        @keyframes loading {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }


        /* =========================================
           TOP CINEMA TEXT
        ========================================= */

        .top-text {

            position: fixed;

            top: 28px;

            width: 100%;

            text-align: center;

            font-size: 10px;

            letter-spacing: 5px;

            color:
                rgba(255,255,255,0.40);

            text-transform: uppercase;

            z-index: 20;
        }


        /* =========================================
           BOTTOM
        ========================================= */

        .bottom-text {

            position: fixed;

            bottom: 25px;

            width: 100%;

            text-align: center;

            font-size: 10px;

            letter-spacing: 3px;

            color:
                rgba(255,255,255,0.35);

            z-index: 20;
        }


        /* =========================================
           FLOATING PARTICLES
        ========================================= */

        .particle {

            position: fixed;

            bottom: -20px;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background:
                rgba(255,180,220,0.7);

            pointer-events: none;

            animation:
                floatParticle linear forwards;

            z-index: 5;
        }


        @keyframes floatParticle {

            from {

                transform:
                    translateY(0);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            to {

                transform:
                    translateY(-110vh);

                opacity: 0;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .scene {

                padding:
                    20px;
            }


            .present {

                font-size: 9px;

                letter-spacing: 4px;
            }


            .story {

                font-size:
                    clamp(40px, 14vw, 65px);

                letter-spacing: 3px;
            }


            .story-text {

                font-size: 13px;

                letter-spacing: 2px;

                padding: 0 15px;
            }


            .names {

                font-size:
                    clamp(28px, 10vw, 44px);
            }


            .tagline {

                font-size: 9px;

                letter-spacing: 2px;
            }


            .begin-btn {

                padding:
                    15px 27px;

                font-size: 12px;
            }


            .top-text {

                font-size: 8px;

                letter-spacing: 3px;
            }
        }

    </style>
</head>


<body>


    <!-- Background -->

    <div class="blur-bg"></div>

    <img
        class="main-photo"
        src="./photos/Chhaya%2010.jpeg"
        alt=""
    >

    <div class="overlay"></div>


    <!-- Stars -->

    <div
        class="stars"
        id="stars"
    ></div>


    <!-- Top -->

    <div class="top-text">
        A Birthday Story
    </div>


    <!-- Main Scene -->

    <main class="scene">

        <div class="content">


            <div class="present">

                A Special Presentation

            </div>


            <div class="story">

                A STORY

            </div>


            <div class="line"></div>


            <div class="story-text">

                Written by memories.<br>

                Filled with moments.<br>

                Created with love.

            </div>


            <div class="names">

                Rohit

                <span class="heart">
                    ❤️
                </span>

                Chhaya

            </div>


            <div class="tagline">

                One heart • One story • One beautiful journey

            </div>


            <button
                class="begin-btn"
                id="beginBtn"
                type="button"
            >

                ✨ BEGIN OUR STORY

            </button>


        </div>

    </main>


    <!-- Bottom -->

    <div class="bottom-text">

        Some stories are worth remembering forever ❤️

    </div>


    <!-- Loading -->

    <div class="loading-line"></div>


    <!-- Vignette -->

    <div class="vignette"></div>


    <script>


        /* =========================================
           CREATE STARS
        ========================================= */

        const stars =
            document.getElementById("stars");


        for (let i = 0; i < 100; i++) {

            const star =
                document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDelay =
                Math.random() * 3 + "s";

            star.style.animationDuration =
                (1.5 + Math.random() * 2.5) + "s";

            stars.appendChild(star);
        }



        /* =========================================
           PARTICLES
        ========================================= */

        function createParticle() {

            const particle =
                document.createElement("div");

            particle.className =
                "particle";

            particle.style.left =
                Math.random() * 100 + "vw";

            particle.style.animationDuration =
                (5 + Math.random() * 6) + "s";

            document.body.appendChild(particle);


            setTimeout(function () {

                particle.remove();

            }, 12000);
        }


        for (let i = 0; i < 25; i++) {

            createParticle();

        }


        setInterval(
            createParticle,
            600
        );



        /* =========================================
           BEGIN BUTTON
        ========================================= */

        document
            .getElementById("beginBtn")
            .addEventListener(
                "click",
                function () {

                    const button = this;

                    button.innerHTML =
                        "❤️ Opening Our Story...";

                    button.disabled = true;

                    button.style.transform =
                        "scale(0.96)";


                    document.body.style.transition =
                        "opacity 1.2s ease";

                    document.body.style.opacity =
                        "0";


                    setTimeout(function () {

                        window.location.href =
                            "./heartbeat.html";

                    }, 1200);

                }
            );


        /* =========================================
           AUTO TRANSITION
           
           If user does nothing for 12 sec,
           page continues automatically.
        ========================================= */

        setTimeout(function () {

            const button =
                document.getElementById("beginBtn");

            if (!button.disabled) {

                button.innerHTML =
                    "✨ BEGIN OUR STORY";

            }

        }, 8000);

    </script>

</body>
</html>
