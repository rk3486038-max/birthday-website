
name: Deploy Birthday Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")
          script_path = "/birthday-website/page-transition.js"

          for file in root.rglob("*.html"):
              content = file.read_text(encoding="utf-8")

              # Avoid adding the script more than once
              if "page-transition.js" in content:
                  continue

              tag = f'<script src="{script_path}"></script>'

              updated, count = re.subn(
                  r"</body\s*>",
                  tag + "\n</body>",
                  content,
                  count=1,
                  flags=re.IGNORECASE
              )

              if count:
                  file.write_text(updated, encoding="utf-8")
                  print(f"Added transition script: {file}")
              else:
                  print(f"WARNING: No closing body tag found: {file}")
          PY

      - name: Verify transition script
        run: |
          test -f _site/page-transition.js || {
            echo "ERROR: page-transition.js missing from repository root"
            exit 1
          }

          echo "Transition script found."
          find _site -name "*.html" -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
