
name: Deploy Birthday Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website and inject transitions
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")

          for html_file in root.rglob("*.html"):
              content = html_file.read_text(encoding="utf-8")

              if "page-transition.js" in content:
                  continue

              relative_js = "./page-transition.js"
              depth = len(html_file.relative_to(root).parts) - 1
              if depth:
                  relative_js = "../" * depth + "page-transition.js"

              tag = f'<script src="{relative_js}"></script>'
              updated, count = re.subn(
                  r"</body\s*>",
                  tag + "\n</body>",
                  content,
                  count=1,
                  flags=re.IGNORECASE
              )

              if count:
                  html_file.write_text(updated, encoding="utf-8")
                  print(f"Injected script into {html_file}")
              else:
                  print(f"No closing body tag: {html_file}")
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
