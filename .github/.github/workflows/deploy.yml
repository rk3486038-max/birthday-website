
name: Deploy Birthday Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")

          for file in root.rglob("*.html"):
              content = file.read_text(encoding="utf-8")

              if "page-transition.js" in content:
                  continue

              depth = len(file.relative_to(root).parts) - 1
              script = "../" * depth + "page-transition.js"
              tag = f'<script src="{script}"></script>'

              updated, count = re.subn(
                  r"</body\s*>",
                  tag + "\n</body>",
                  content,
                  count=1,
                  flags=re.IGNORECASE
              )

              if count:
                  file.write_text(updated, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
