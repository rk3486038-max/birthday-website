<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter From Our Future 💌</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    min-height:100%;
    width:100%;
    overflow-x:hidden;
    font-family:Georgia, "Times New Roman", serif;
}

body{
    background:#08000d;
    color:white;
    min-height:100vh;
}

/* Background */
.background{
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(10,0,18,.72),rgba(8,0,14,.88)),
        url("./photos/Chhaya%2010.jpeg") center/cover no-repeat;
    transform:scale(1.03);
    z-index:-3;
}

.overlay{
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at center,
            rgba(255,80,170,.16),
            transparent 50%
        );
    z-index:-2;
}

/* Stars */
.star{
    position:fixed;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
    z-index:-1;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1.4);
    }
}

/* Main */
.container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.card{
    width:min(850px,96%);
    padding:35px 28px 40px;
    text-align:center;
    border-radius:30px;
    background:rgba(25,7,30,.72);
    border:1px solid rgba(255,150,200,.28);
    box-shadow:
        0 0 50px rgba(255,50,150,.15),
        inset 0 0 40px rgba(255,100,180,.04);
    backdrop-filter:blur(13px);
}

.step{
    display:inline-block;
    padding:7px 18px;
    border-radius:30px;
    border:1px solid rgba(255,120,190,.35);
    background:rgba(255,70,150,.1);
    color:#ff9dca;
    font-family:Arial,sans-serif;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:15px;
}

h1{
    font-family:Georgia,serif;
    font-size:clamp(34px,6vw,58px);
    margin-bottom:10px;
    text-shadow:0 0 25px rgba(255,70,160,.7);
}

.subtitle{
    color:#e8cbdc;
    font-family:Arial,sans-serif;
    font-size:16px;
    margin-bottom:28px;
}

/* Envelope */
.envelope-area{
    position:relative;
    width:180px;
    height:135px;
    margin:0 auto 30px;
    perspective:700px;
}

.envelope{
    position:absolute;
    width:180px;
    height:125px;
    bottom:0;
    left:0;
    background:linear-gradient(135deg,#ff4f9a,#9c2cff);
    border-radius:8px;
    box-shadow:0 15px 35px rgba(255,40,140,.3);
}

.envelope:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    border-left:90px solid transparent;
    border-right:90px solid transparent;
    border-top:65px solid rgba(255,255,255,.25);
}

.envelope:after{
    content:"❤️";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-40%);
    font-size:34px;
    z-index:4;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.7));
}

/* Letter */
.letter{
    position:relative;
    max-width:700px;
    margin:0 auto;
    padding:32px 30px;
    text-align:left;
    border-radius:18px;
    background:
        linear-gradient(
            rgba(255,245,250,.97),
            rgba(255,235,245,.96)
        );
    color:#4a2035;
    box-shadow:
        0 15px 50px rgba(0,0,0,.4),
        0 0 25px rgba(255,80,170,.12);
    border:1px solid rgba(255,255,255,.5);
}

/* Paper decorations */
.letter:before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(180,60,110,.15);
    border-radius:12px;
    pointer-events:none;
}

.letter-top{
    text-align:center;
    margin-bottom:20px;
    color:#a82c68;
    font-size:14px;
    letter-spacing:2px;
}

.letter-content{
    position:relative;
    z-index:2;
    font-size:18px;
    line-height:1.85;
    white-space:pre-line;
    min-height:330px;
}

.cursor{
    display:inline-block;
    width:2px;
    height:20px;
    background:#b72d6c;
    animation:blink .7s infinite;
    vertical-align:middle;
}

@keyframes blink{
    50%{opacity:0;}
}

.signature{
    text-align:right;
    margin-top:20px;
    font-size:22px;
    color:#a52a65;
    font-style:italic;
    opacity:0;
    transition:1s;
}

.signature.show{
    opacity:1;
}

.future{
    margin-top:25px;
    text-align:center;
    color:#ffe0ef;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.7;
}

/* Button */
.continue-btn{
    margin-top:30px;
    padding:15px 35px;
    border:0;
    border-radius:40px;
    color:white;
    font-family:Arial,sans-serif;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#ff197d,#9c2cff);
    box-shadow:0 0 25px rgba(255,40,140,.35);
    transition:.3s;
}

.continue-btn:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 0 38px rgba(255,40,140,.65);
}

/* Hearts */
.float-heart{
    position:fixed;
    bottom:-30px;
    pointer-events:none;
    z-index:10;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) scale(.6);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-110vh)
            rotate(25deg)
            scale(1.3);
        opacity:0;
    }
}

/* Mobile */
@media(max-width:600px){

    .container{
        padding:20px 10px;
    }

    .card{
        padding:27px 14px 32px;
        border-radius:24px;
    }

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:14px;
    }

    .letter{
        padding:25px 20px;
    }

    .letter-content{
        font-size:16px;
        line-height:1.75;
        min-height:390px;
    }

    .envelope-area{
        transform:scale(.9);
        margin-bottom:20px;
    }

    .continue-btn{
        width:90%;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="container">

<div class="card">

<div class="step">STEP 5 • FUTURE LETTER</div>

<h1>A Letter From Our Future 💌</h1>

<p class="subtitle">
Some letters are written today...<br>
but meant to be read years from now.
</p>

<div class="envelope-area">
    <div class="envelope"></div>
</div>

<div class="letter">

<div class="letter-top">
FOR CHHAYA ❤️ — FROM ROHIT
</div>

<div id="letterContent" class="letter-content"></div>

<div id="signature" class="signature">
Forever yours,<br>
Rohit ❤️
</div>

</div>

<div class="future">
If you're reading this someday in the future,<br>
I hope we're still choosing each other. ♾️
</div>

<button
    id="continueBtn"
    class="continue-btn"
    onclick="continueNext()"
    style="display:none;"
>
Open The Next Surprise 🎁
</button>

</div>
</div>

<script>

/* Stars */
for(let i=0;i<90;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=
        (Math.random()*3)+"s";

    document.body.appendChild(star);
}


/* Letter */
const letterText =
`Dear Chhaya,

If you're reading this, then time has passed...

Maybe we've changed.
Maybe life has taken us through beautiful,
difficult and unexpected moments.

But I hope one thing has never changed —
the way I look at you.

I hope we still laugh at the smallest things.
I hope we still remember how our story began.
I hope we still talk for hours without realizing
how quickly the night has passed.

And if life ever becomes difficult,
I hope you remember this...

I didn't choose you only for the easy days.

I chose you for the ordinary days,
the crazy days,
the quiet days,
the beautiful days,
and every day that comes after them.

From our first conversations
to all the memories we haven't created yet...

I would still choose you.

Today.
Tomorrow.
And every tomorrow after that.

Because somewhere between
"Hey ❤️"
and "Forever ♾️",

you became my favorite part of life.

Thank you for being you.

And if I could send one message
back through time to the Rohit
who first met you...

I would simply tell him:

"Hold on to her.
She's going to become your favorite story."

Happy Birthday, Chhaya. ❤️`;

let index=0;

const content=
document.getElementById("letterContent");

const signature=
document.getElementById("signature");

const continueBtn=
document.getElementById("continueBtn");


function typeLetter(){

    if(index < letterText.length){

        content.textContent=
            letterText.substring(0,index+1);

        index++;

        let delay=28;

        if(
            letterText[index-1]==="." ||
            letterText[index-1]==="," ||
            letterText[index-1]==="\n"
        ){
            delay=180;
        }

        setTimeout(typeLetter,delay);

    }else{

        signature.classList.add("show");

        setTimeout(function(){

            continueBtn.style.display="inline-block";

        },1000);

    }
}


/* Start typing */
setTimeout(typeLetter,1200);


/* Floating hearts */
function createHeart(){

    const heart=document.createElement("div");

    heart.className="float-heart";

    const hearts=[
        "❤️",
        "💗",
        "💕",
        "💖",
        "💘"
    ];

    heart.innerHTML=
        hearts[
            Math.floor(Math.random()*hearts.length)
        ];

    heart.style.left=
        Math.random()*100+"%";

    heart.style.fontSize=
        (14+Math.random()*18)+"px";

    heart.style.animationDuration=
        (4+Math.random()*4)+"s";

    document.body.appendChild(heart);

    setTimeout(function(){

        heart.remove();

    },8000);
}


/* Continuous hearts */
setInterval(function(){

    createHeart();

},1200);


/* Continue */
function continueNext(){

    for(let i=0;i<35;i++){

        setTimeout(function(){

            createHeart();

        },i*35);

    }

    setTimeout(function(){

        window.location.href="./mystery-box.html";

    },1800);
}

</script>

</body>
</html>
