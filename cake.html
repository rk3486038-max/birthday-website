<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Let's Celebrate Chhaya ❤️</title>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>  
  
    <style>  
        * {  
            margin: 0;  
            padding: 0;  
            box-sizing: border-box;  
        }  
  
        html,  
        body {  
            width: 100%;  
            height: 100%;  
            overflow: hidden;  
            font-family: Arial, sans-serif;  
        }  
  
        body {  
            position: relative;  
            background: #111;  
        }  
  
        /* =========================================  
           PREMIUM BLURRED BACKGROUND  
           ========================================= */  
  
        .blur-background {  
            position: fixed;  
            inset: -35px;  
            width: calc(100% + 70px);  
            height: calc(100% + 70px);  
  
            object-fit: cover;  
            object-position: center center;  
  
            filter: blur(22px);  
            transform: scale(1.08);  
  
            z-index: -30;  
        }  
  
        /* =========================================  
           MAIN ZOOMED-OUT PHOTO  
           ========================================= */  
  
        .chhaya-background {  
            position: fixed;  
  
            top: 50%;  
            left: 50%;  
  
            width: 100%;  
            height: 100%;  
  
            transform: translate(-50%, -50%) scale(0.78);  
  
            object-fit: contain;  
            object-position: center center;  
  
            z-index: -20;  
  
            display: block;  
  
            filter: brightness(0.92);  
  
            border-radius: 18px;  
        }  
  
        /* Soft premium overlay */  
  
        .photo-overlay {  
            position: fixed;  
            inset: 0;  
  
            background:  
                linear-gradient(  
                    to bottom,  
                    rgba(0, 0, 0, 0.18),  
                    rgba(0, 0, 0, 0.05),  
                    rgba(0, 0, 0, 0.25)  
                );  
  
            z-index: -10;  
  
            pointer-events: none;  
        }  
  
        /* =========================================  
           HEADING  
           ========================================= */  
  
        .title {  
            position: absolute;  
            top: 25px;  
            left: 50%;  
            transform: translateX(-50%);  
  
            width: 100%;  
            text-align: center;  
  
            color: white;  
            font-size: clamp(25px, 5vw, 48px);  
            font-weight: bold;  
  
            text-shadow:  
                0 3px 10px rgba(0, 0, 0, 0.8),  
                0 0 20px rgba(255, 80, 130, 0.7);  
  
            z-index: 10;  
  
            animation: titleGlow 2s infinite alternate;  
        }  
  
        @keyframes titleGlow {  
            from {  
                transform: translateX(-50%) scale(1);  
            }  
  
            to {  
                transform: translateX(-50%) scale(1.04);  
            }  
        }  
  
        /* =========================================  
           CAKE AREA  
           ========================================= */  
  
        .cake-container {  
            position: absolute;  
  
            left: 50%;  
            top: 55%;  
  
            transform: translate(-50%, -50%);  
  
            width: min(330px, 75vw);  
            height: 300px;  
  
            cursor: pointer;  
  
            z-index: 5;  
        }  
  
        /* Plate */  
  
        .plate {  
            position: absolute;  
  
            left: 50%;  
            bottom: 20px;  
  
            transform: translateX(-50%);  
  
            width: 290px;  
            height: 28px;  
  
            background: linear-gradient(  
                to bottom,  
                #ffffff,  
                #ddd  
            );  
  
            border-radius: 50%;  
  
            box-shadow:  
                0 10px 25px rgba(0, 0, 0, 0.45),  
                inset 0 -5px 10px rgba(0, 0, 0, 0.15);  
        }  
  
        /* Bottom Cake */  
  
        .cake-bottom {  
            position: absolute;  
  
            left: 50%;  
            bottom: 45px;  
  
            transform: translateX(-50%);  
  
            width: 250px;  
            height: 65px;  
  
            background: linear-gradient(  
                to bottom,  
                #ffb6c9,  
                #ff7096  
            );  
  
            border-radius: 12px 12px 18px 18px;  
  
            box-shadow:  
                0 8px 15px rgba(0, 0, 0, 0.3);  
        }  
  
        /* Middle Cake */  
  
        .cake-middle {  
            position: absolute;  
  
            left: 50%;  
            bottom: 100px;  
  
            transform: translateX(-50%);  
  
            width: 230px;  
            height: 55px;  
  
            background: linear-gradient(  
                to bottom,  
                #fff0f5,  
                #ffb0c8  
            );  
  
            border-radius: 10px;  
  
            box-shadow:  
                0 5px 12px rgba(0, 0, 0, 0.25);  
        }  
  
        /* Top Cake */  
  
        .cake-top {  
            position: absolute;  
  
            left: 50%;  
            bottom: 148px;  
  
            transform: translateX(-50%);  
  
            width: 210px;  
            height: 50px;  
  
            background: linear-gradient(  
                to bottom,  
                #ffd6e4,  
                #ff8fb1  
            );  
  
            border-radius: 12px 12px 15px 15px;  
  
            box-shadow:  
                0 5px 12px rgba(0, 0, 0, 0.25);  
        }  
  
        /* Frosting */  
  
        .frosting {  
            position: absolute;  
  
            left: 50%;  
            bottom: 183px;  
  
            transform: translateX(-50%);  
  
            width: 215px;  
            height: 25px;  
  
            background: white;  
  
            border-radius: 50%;  
  
            box-shadow:  
                0 3px 8px rgba(0, 0, 0, 0.2);  
        }  
  
        /* Frosting drops */  
  
        .frosting::before,  
        .frosting::after {  
            content: "";  
  
            position: absolute;  
  
            background: white;  
  
            width: 22px;  
            height: 35px;  
  
            border-radius: 0 0 15px 15px;  
        }  
  
        .frosting::before {  
            left: 35px;  
            top: 8px;  
        }  
  
        .frosting::after {  
            right: 40px;  
            top: 8px;  
        }  
  
        /* =========================================  
           CHERRIES  
           ========================================= */  
  
        .cherry {  
            position: absolute;  
  
            width: 18px;  
            height: 18px;  
  
            background: #e60039;  
  
            border-radius: 50%;  
  
            bottom: 190px;  
  
            box-shadow:  
                inset -3px -3px 5px rgba(0, 0, 0, 0.3),  
                0 3px 6px rgba(0, 0, 0, 0.25);  
        }  
  
        .cherry.one {  
            left: 72px;  
        }  
  
        .cherry.two {  
            right: 72px;  
        }  
  
        .cherry.three {  
            left: 50%;  
            transform: translateX(-50%);  
            bottom: 197px;  
        }  
  
        /* =========================================  
           CANDLE  
           ========================================= */  
  
        .candle {  
            position: absolute;  
  
            left: 50%;  
            bottom: 205px;  
  
            transform: translateX(-50%);  
  
            width: 18px;  
            height: 55px;  
  
            background: repeating-linear-gradient(  
                45deg,  
                #ffffff,  
                #ffffff 8px,  
                #ff5f9e 8px,  
                #ff5f9e 16px  
            );  
  
            border-radius: 5px;  
  
            box-shadow:  
                0 3px 8px rgba(0, 0, 0, 0.3);  
        }  
  
        /* Flame */  
  
        .flame {  
            position: absolute;  
  
            left: 50%;  
            bottom: 258px;  
  
            transform: translateX(-50%);  
  
            width: 22px;  
            height: 32px;  
  
            background: linear-gradient(  
                to top,  
                #ff5e00,  
                #ffd000,  
                #fff  
            );  
  
            border-radius: 50% 50% 50% 50%;  
  
            box-shadow:  
                0 0 20px #ff9d00,  
                0 0 35px rgba(255, 165, 0, 0.8);  
  
            animation: flicker 0.7s infinite alternate;  
  
            z-index: 2;  
        }  
  
        @keyframes flicker {  
            from {  
                transform: translateX(-50%) scale(1);  
            }  
  
            to {  
                transform: translateX(-50%) scale(1.15);  
            }  
        }  
  
        /* =========================================  
           KNIFE  
           ========================================= */  
  
        .knife {  
            position: absolute;  
  
            width: 145px;  
            height: 18px;  
  
            right: -15px;  
            top: 95px;  
  
            background: linear-gradient(  
                to bottom,  
                #ffffff,  
                #bdbdbd  
            );  
  
            border-radius: 3px;  
  
            transform: rotate(-35deg);  
  
            transform-origin: left center;  
  
            opacity: 0;  
  
            z-index: 20;  
  
            box-shadow:  
                0 4px 8px rgba(0, 0, 0, 0.35);  
        }  
  
        .knife::after {  
            content: "";  
  
            position: absolute;  
  
            left: -45px;  
            top: -5px;  
  
            width: 50px;  
            height: 28px;  
  
            background: #492719;  
  
            border-radius: 8px;  
  
            box-shadow:  
                0 3px 6px rgba(0, 0, 0, 0.35);  
        }  
  
        /* =========================================  
           CUT LINE  
           ========================================= */  
  
        .cut-line {  
            position: absolute;  
  
            left: 50%;  
            bottom: 45px;  
  
            width: 4px;  
  
            height: 140px;  
  
            background: rgba(255, 255, 255, 0.9);  
  
            transform: translateX(-50%);  
  
            opacity: 0;  
  
            z-index: 10;  
  
            box-shadow:  
                0 0 8px white;  
        }  
  
        /* =========================================  
           INSTRUCTION  
           ========================================= */  
  
        .instruction {  
            position: absolute;  
  
            bottom: 20px;  
            left: 50%;  
  
            transform: translateX(-50%);  
  
            width: 90%;  
  
            text-align: center;  
  
            color: white;  
  
            font-size: clamp(15px, 3vw, 21px);  
            font-weight: bold;  
  
            text-shadow:  
                0 2px 8px black;  
  
            z-index: 15;  
  
            animation: pulseText 1.5s infinite;  
        }  
  
        @keyframes pulseText {  
            0%,  
            100% {  
                opacity: 1;  
            }  
  
            50% {  
                opacity: 0.65;  
            }  
        }  
  
        /* =========================================  
           BIRTHDAY MESSAGE  
           ========================================= */  
  
        .birthday-message {  
            position: absolute;  
  
            left: 50%;  
            top: 50%;  
  
            transform: translate(-50%, -50%) scale(0);  
  
            width: 90%;  
  
            text-align: center;  
  
            color: white;  
  
            font-size: clamp(28px, 7vw, 65px);  
  
            font-weight: bold;  
  
            text-shadow:  
                0 4px 15px rgba(0, 0, 0, 0.9),  
                0 0 30px rgba(255, 80, 130, 0.8);  
  
            z-index: 50;  
        }  
  
        /* =========================================  
           NEXT BUTTON  
           ========================================= */  
  
        .next-btn {  
            position: absolute;  
  
            left: 50%;  
  
            bottom: 35px;  
  
            transform: translateX(-50%) scale(0);  
  
            padding: 15px 28px;  
  
            border: none;  
  
            border-radius: 30px;  
  
            background: linear-gradient(  
                135deg,  
                #ff4f91,  
                #ff1744  
            );  
  
            color: white;  
  
            font-size: 17px;  
  
            font-weight: bold;  
  
            cursor: pointer;  
  
            box-shadow:  
                0 8px 25px rgba(0, 0, 0, 0.35);  
  
            z-index: 60;  
        }  
  
        .next-btn:hover {  
            transform: translateX(-50%) scale(1.08);  
        }  
  
        /* =========================================  
           HEARTS  
           ========================================= */  
  
        .heart {  
            position: absolute;  
  
            bottom: -50px;  
  
            color: #ff4f81;  
  
            font-size: 25px;  
  
            z-index: 3;  
  
            animation: floatHeart linear infinite;  
        }  
  
        @keyframes floatHeart {  
            from {  
                transform: translateY(0) rotate(0deg);  
  
                opacity: 0;  
            }  
  
            15% {  
                opacity: 1;  
            }  
  
            to {  
                transform: translateY(-110vh) rotate(360deg);  
  
                opacity: 0;  
            }  
        }  
  
        /* =========================================  
           BALLOONS  
           ========================================= */  
  
        .balloon {  
            position: absolute;  
  
            width: 45px;  
  
            height: 55px;  
  
            border-radius: 50%;  
  
            z-index: 2;  
  
            animation: balloonFloat 5s ease-in-out infinite;  
        }  
  
        .balloon::after {  
            content: "";  
  
            position: absolute;  
  
            top: 52px;  
  
            left: 50%;  
  
            width: 1px;  
  
            height: 100px;  
  
            background: rgba(255, 255, 255, 0.8);  
        }  
  
        @keyframes balloonFloat {  
            0%,  
            100% {  
                transform: translateY(0);  
            }  
  
            50% {  
                transform: translateY(-25px);  
            }  
        }  
  
        .balloon:nth-child(1) {  
            left: 8%;  
  
            top: 15%;  
  
            background: #ff4f81;  
        }  
  
        .balloon:nth-child(2) {  
            right: 8%;  
  
            top: 18%;  
  
            background: #ffcc33;  
  
            animation-delay: 1s;  
        }  
  
        .balloon:nth-child(3) {  
            left: 15%;  
  
            top: 55%;  
  
            background: #8e7dff;  
  
            animation-delay: 2s;  
        }  
  
        .balloon:nth-child(4) {  
            right: 15%;  
  
            top: 60%;  
  
            background: #45d9c5;  
  
            animation-delay: 1.5s;  
        }  
  
        /* =========================================  
           CONFETTI  
           ========================================= */  
  
        .confetti {  
            position: fixed;  
  
            width: 10px;  
  
            height: 18px;  
  
            top: -30px;  
  
            z-index: 100;  
  
            opacity: 0;  
        }  
  
        /* =========================================  
           MOBILE  
           ========================================= */  
  
        @media (max-width: 600px) {  
  
            .blur-background {  
                filter: blur(18px);  
  
                transform: scale(1.12);  
            }  
  
            .chhaya-background {  
                width: 100%;  
  
                height: 100%;  
  
                transform:  
                    translate(-50%, -50%)  
                    scale(0.72);  
            }  
  
            .title {  
                top: 18px;  
  
                font-size: 27px;  
            }  
  
            .cake-container {  
                top: 57%;  
  
                transform: translate(-50%, -50%) scale(0.78);  
            }  
  
            .balloon {  
                transform: scale(0.75);  
            }  
  
            .instruction {  
                bottom: 12px;  
  
                font-size: 14px;  
            }  
  
            .next-btn {  
                bottom: 25px;  
  
                font-size: 15px;  
  
                padding: 13px 22px;  
            }  
        }  
  
        @media (max-height: 650px) {  
  
            .cake-container {  
                transform:  
                    translate(-50%, -50%)  
                    scale(0.68);  
            }  
  
            .title {  
                top: 10px;  
            }  
        }  
    </style>  
</head>  
  
<body>  
  
    <!-- =========================================  
         BLURRED BACKGROUND

    <img

        alt="Chhaya"  
    >  
  
    <div class="photo-overlay"></div>  
  
    <!-- Balloons -->  
  
    <div class="balloon"></div>  
  
    <div class="balloon"></div>

    <div class="title">

    <!-- =========================================

    <div class="cake-container" id="cake">  
  
        <div class="plate"></div>  
  
        <div class="cake-bottom"></div>  
  
        <div class="cake-middle"></div>  
  
        <div class="cake-top"></div>  
  
        <div class="frosting"></div>  
  
        <div class="cherry one"></div>  
  
        <div class="cherry two"></div>  
  
        <div class="cherry three"></div>  
  
        <div class="candle"></div>  
  
        <div class="flame" id="flame"></div>

        <div class="cut-line" id="cutLine"></div>

    <button class="next-btn" id="nextBtn">  
        Continue Our Love Story ❤️ →  
    </button>  
  
    <script>  
  
        const cake = document.getElementById("cake");  
  
        const knife = document.getElementById("knife");  
  
        const flame = document.getElementById("flame");  
  
        const cutLine = document.getElementById("cutLine");  
  
        const instruction = document.getElementById("instruction");  
  
        const birthdayMessage =  
            document.getElementById("birthdayMessage");  
  
        const nextBtn = document.getElementById("nextBtn");  
  
        let cut = false;  
  
        /* =========================================  
           FLOATING HEARTS  
           ========================================= */  
  
        function createHeart() {  
  
            const heart = document.createElement("div");  
  
            heart.className = "heart";  
  
            heart.innerHTML = "❤️";  
  
            heart.style.left =  
                Math.random() * 100 + "%";  
  
            heart.style.fontSize =  
                (15 + Math.random() * 25) + "px";  
  
            heart.style.animationDuration =  
                (5 + Math.random() * 5) + "s";  
  
            document.body.appendChild(heart);  
  
            setTimeout(() => {  
  
                heart.remove();  
  
            }, 10000);  
  
        }  
  
        setInterval(createHeart, 900);  
  
        /* =========================================  
           CONFETTI  
           ========================================= */  
  
        function createConfetti() {  
  
            for (let i = 0; i < 100; i++) {  
  
                const confetti =  
                    document.createElement("div");  
  
                confetti.className = "confetti";  
  
                confetti.style.left =  
                    Math.random() * 100 + "%";  
  
                confetti.style.width =  
                    (6 + Math.random() * 8) + "px";  
  
                confetti.style.height =  
                    (10 + Math.random() * 12) + "px";  
  
                confetti.style.background =  
                    `hsl(${Math.random() * 360}, 90%, 65%)`;  
  
                document.body.appendChild(confetti);  
  
                gsap.to(confetti, {  
  
                    y: window.innerHeight + 100,  
  
                    rotation:  
                        Math.random() * 720 - 360,  
  
                    duration:  
                        2 + Math.random() * 3,  
  
                    delay:  
                        Math.random() * 0.8,  
  
                    opacity: 1,  
  
                    ease: "power1.out",  
  
                    onComplete: () => {  
  
                        confetti.remove();  
  
                    }  
  
                });  
  
            }  
  
        }  
  
        /* =========================================  
           CAKE CUT ANIMATION  
           ========================================= */  
  
        cake.addEventListener("click", function () {  
  
            if (cut) return;  
  
            cut = true;  
  
            instruction.innerHTML =  
                "❤️ Chhaya is Cutting the Cake! 🎂🔪";  
  
            /* Cake bounce */  
  
            gsap.to(cake, {  
  
                y: -15,  
  
                duration: 0.25,  
  
                repeat: 3,  
  
                yoyo: true,  
  
                ease: "power2.inOut"  
  
            });  
  
            /* Knife */  
  
            gsap.to(knife, {  
  
                opacity: 1,  
  
                duration: 0.3  
  
            });  
  
            gsap.to(knife, {  
  
                x: -100,  
  
                y: 65,  
  
                rotation: 55,  
  
                duration: 1.2,  
  
                delay: 0.4,  
  
                ease: "power2.inOut"  
  
            });  
  
            /* Cut line */  
  
            gsap.to(cutLine, {  
  
                opacity: 1,  
  
                duration: 0.3,  
  
                delay: 1.1  
  
            });  
  
            /* Flame off */  
  
            gsap.to(flame, {  
  
                scale: 0,  
  
                opacity: 0,  
  
                duration: 0.4,  
  
                delay: 1.2  
  
            });  
  
            /* Cake separation */  
  
            gsap.to(".cake-top", {  
  
                x: -45,  
  
                rotation: -5,  
  
                duration: 1,  
  
                delay: 1.5,  
  
                ease: "power2.out"  
  
            });  
  
            gsap.to(".frosting", {  
  
                x: -45,  
  
                rotation: -5,  
  
                duration: 1,  
  
                delay: 1.5,  
  
                ease: "power2.out"  
  
            });  
  
            gsap.to(".cake-middle", {  
  
                x: 40,  
  
                rotation: 4,  
  
                duration: 1,  
  
                delay: 1.5,  
  
                ease: "power2.out"  
  
            });  
  
            /* Birthday message */  
  
            gsap.to(birthdayMessage, {  
  
                scale: 1,  
  
                duration: 1,  
  
                delay: 2.2,  
  
                ease: "back.out(1.7)"  
  
            });  
  
            /* Confetti */  
  
            setTimeout(() => {  
  
                createConfetti();  
  
            }, 2000);  
  
            /* Hearts burst */  
  
            for (let i = 0; i < 20; i++) {  
  
                setTimeout(() => {  
  
                    createHeart();  
  
                }, i * 80);  
  
            }  
  
            /* Next button */  
  
            gsap.to(nextBtn, {  
  
                scale: 1,  
  
                duration: 0.8,  
  
                delay: 4,  
  
                ease: "back.out(1.7)"  
  
            });  
  
            instruction.style.animation = "none";  
  
        });  
  
        /* =========================================  
           NEXT PAGE  
           ========================================= */  
  
        nextBtn.addEventListener("click", function () {  
  
            window.location.href = "./trailer.html";  
  
        });  
  
    </script>  
  
</body>  
</html>
